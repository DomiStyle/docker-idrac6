version: '3.1'

services:
  idrac1:
    image: domistyle/idrac6
    restart: always
    ports:
      - 5800:5800
      - 5900:5900
    environment:
      - IDRAC_HOST=${IDRAC_HOST:-idrac1.example.org}
      - IDRAC_USER=${IDRAC_USER:-root}
      - IDRAC_PASSWORD=${IDRAC_PASSWORD:-1234}
    # Experimental! To directly mount an iso as iDRAC virtual media, 
    # uncomment the below and set to a filename that appears in /vmedia
      # - VIRTUAL_ISO=name_of_iso.iso
    volumes:
      - ${PATH_APP:-./app}:/app
      - ${PATH_VMEDIA:-./vmedia}:/vmedia
      - ${PATH_SCREENSHOTS:-./screenshots}:/screenshots
  idrac2:
    image: domistyle/idrac6
    restart: always
    ports:
      - 5801:5800
      - 5901:5900
    secrets:
      - idrac_host
      - idrac_user
      - idrac_password
    volumes:
      - ${PATH_APP:-./app}:/app
      - ${PATH_VMEDIA:-./vmedia}:/vmedia
      - ${PATH_SCREENSHOTS:-./screenshots}:/screenshots
secrets:
  idrac_host:
    file: ./idrac_host.txt
  idrac_user:
    file: ./idrac_user.txt
  idrac_password:
    file: ./idrac_password.txt